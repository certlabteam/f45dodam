  function b64(s) {
    const raw = atob(s);
    const out = new Uint8Array(raw.length);
    for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  async function unlock(pw) {
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey(
      'raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name: 'PBKDF2', salt: b64(LOCKED.salt), iterations: LOCKED.iter,
       hash: 'SHA-256'},
      base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt(
      {name: 'AES-GCM', iv: b64(LOCKED.nonce)}, key, b64(LOCKED.data));
    return new TextDecoder().decode(plain);
  }

  function ask(msg) {
    document.body.innerHTML = ''
      + '<div class="lock-wrap">'
      + '  <div class="lock-box">'
      + '    <h1>F45 도담 회원 리스트</h1>'
      + '    <p>비밀번호를 넣어 주세요</p>'
      + '    <input id="lock-pw" type="password" autocomplete="current-password" autofocus>'
      + '    <button id="lock-go">열기</button>'
      + '    <div class="lock-msg">' + (msg || '') + '</div>'
      + '  </div>'
      + '</div>';
    const inp = document.getElementById('lock-pw');
    const go = async function () {
      const pw = inp.value;
      if (!pw) return;
      document.querySelector('.lock-msg').textContent = '여는 중…';
      let text;
      try {
        text = await unlock(pw);
      } catch (e) {
        ask('비밀번호가 맞지 않습니다');
        return;
      }
      try { sessionStorage.setItem('f45pw', pw); } catch (e) {}
      show(text);
    };
    document.getElementById('lock-go').addEventListener('click', go);
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); });
  }

  function show(text) {
    // document.write 로는 안에 든 script 가 제대로 안 돈다.
    // 통째로 갈아끼우고 script 만 다시 만들어 붙인다.
    const doc = new DOMParser().parseFromString(text, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    document.querySelectorAll('script').forEach(function (old) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      old.replaceWith(s);
    });
  }

  // 한 번 넣었으면 이 창에서는 다시 안 묻는다
  const saved = (function () {
    try { return sessionStorage.getItem('f45pw'); } catch (e) { return null; }
  })();
  if (saved) {
    unlock(saved).then(show).catch(function () { ask(''); });
  } else {
    ask('');
  }
})();
</script>
